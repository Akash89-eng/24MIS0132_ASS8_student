<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .event-box {
            background: #f3f4ff;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .event-box h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <p class="description">
        Register for the upcoming college technical event.
    </p>

    <div class="event-box">
        <h2>AI & Cloud Computing Workshop</h2>
        <p>
            Learn about Artificial Intelligence, Cloud Computing,
            Docker and Kubernetes through practical sessions.
        </p>
    </div>

    <form onsubmit="registerStudent(event)">

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Register Number</label>
            <input type="text" id="registerNumber"
                   placeholder="Enter register number" required>
        </div>

        <div class="form-group">
            <label>Department</label>
            <select id="department" required>
                <option value="">Select Department</option>
                <option>CSE</option>
                <option>ISE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>Mechanical</option>
                <option>Civil</option>
            </select>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email"
                   placeholder="Enter email address" required>
        </div>

        <div class="form-group">
            <label>Event Date</label>
            <input type="date" id="eventDate" required>
        </div>

        <button type="submit">
            Register for Event
        </button>

    </form>

    <div id="message">
        Registration successful!
    </div>

</div>

<script>
function registerStudent(event) {
    event.preventDefault();

    const name = document.getElementById("studentName").value;

    document.getElementById("message").style.display = "block";

    document.getElementById("message").innerHTML =
        "Registration successful for " + name + "!";
}
</script>

</body>
</html>
