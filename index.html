<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .event {
            background: #eef2ff;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .event h2 {
            color: #3730a3;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <p class="description">
        Register for our upcoming college technical event.
    </p>

    <div class="event">
        <h2>AI & Cloud Computing Workshop</h2>
        <p>
            Learn Artificial Intelligence, Cloud Computing,
            Docker and Kubernetes through practical sessions.
        </p>
    </div>

    <form onsubmit="registerStudent(event)">

        <label>Student Name</label>
        <input type="text" id="name"
               placeholder="Enter student name" required>

        <label>Register Number</label>
        <input type="text" id="regno"
               placeholder="Enter register number" required>

        <label>Department</label>
        <select id="department" required>
            <option value="">Select Department</option>
            <option>CSE</option>
            <option>ISE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select>

        <label>Email</label>
        <input type="email" id="email"
               placeholder="Enter email" required>

        <label>Event Date</label>
        <input type="date" id="date" required>

        <button type="submit">
            Register for Event
        </button>

    </form>

    <div id="message">
        Registration Successful!
    </div>

</div>

<script>
function registerStudent(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;

    document.getElementById("message").style.display = "block";
    document.getElementById("message").innerHTML =
        "Registration successful for " + name + "!";
}
</script>

</body>
</html>
